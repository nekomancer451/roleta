<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Roleta de Prêmios</title>
  <style>
    :root {
      --primary-color: #1e88e5;
      --secondary-color: #90caf9;
      --background-color: #e3f2fd;
      --text-color: #0d47a1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      margin: 0;
      padding: 0;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    h1 {
      margin-top: 20px;
      font-size: 2em;
      color: var(--primary-color);
    }

    #adminButton {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #adminButton:hover {
      background-color: var(--text-color);
    }

    #wheel {
        width: 500px;    /* tamanho fixo para evitar distorção */
        height: 500px;
        border: 10px solid var(--primary-color);
        border-radius: 50%;
        background-color: white;
        display: block;
    }


    #pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-bottom: 40px solid red;
      margin-top: 10px;
      position: relative;
      z-index: 1;
    }

    .result {
      margin-top: 20px;
      font-size: 1.5em;
      color: var(--text-color);
      padding: 10px;
    }
  </style>
</head>
<body>
  <button id="adminButton" onclick="location.href='admin.html'">Admin</button>

  <h1>Roleta de Prêmios</h1>
  <div id="pointer"></div>
  <canvas id="wheel" width="500" height="500"></canvas>
  <div class="result" id="result"></div>

  <script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
let currentAngle = 0;

let prizes = JSON.parse(localStorage.getItem("prizes")) || [];

function drawWheel() {
  const numPrizes = prizes.length;
  const arcSize = (2 * Math.PI) / numPrizes;
  const centerX = 250;
  const centerY = 250;
  const radius = 250;

  const colors = [
  "#FF6F61", // vermelho suave
  "#FFA07A", // laranja claro
  "#FFD700", // amarelo dourado
  "#90EE90", // verde claro
  "#32CD99", // verde água
  "#40E0D0", // turquesa
  "#87CEFA", // azul claro
  "#9370DB", // lavanda
  "#BA55D3", // orquídea
  "#FF69B4"  // rosa médio
  ];

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < numPrizes; i++) {
    const angle = i * arcSize;
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, angle, angle + arcSize);

    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(angle + arcSize / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "black";
    ctx.font = "bold 18px Verdana";
    ctx.fillText(prizes[i].name, radius - 20, 0);
    ctx.restore();
  }
}

function spinWheel() {
  const availablePrizes = prizes.filter(p => p.quantity > 0);
  if (availablePrizes.length === 0) {
    document.getElementById("result").innerText = "Todos os prêmios acabaram!";
    return;
  }
  const selected = availablePrizes[Math.floor(Math.random() * availablePrizes.length)];
  selected.quantity--;
  localStorage.setItem("prizes", JSON.stringify(prizes));

  const index = prizes.findIndex(p => p.name === selected.name);
  const arcSize = (2 * Math.PI) / prizes.length;
  const spinAngle = (Math.random() * arcSize + index * arcSize) + 10 * 2 * Math.PI;
  currentAngle = spinAngle;

  const duration = 3000;
  const start = Date.now();
  const animate = () => {
    const now = Date.now();
    const elapsed = now - start;
    if (elapsed < duration) {
      const angle = currentAngle * (elapsed / duration);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(250, 250);
      ctx.rotate(angle);
      ctx.translate(-250, -250);
      drawWheel();
      ctx.restore();
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(250, 250);
      ctx.rotate(currentAngle);
      ctx.translate(-250, -250);
      drawWheel();
      ctx.restore();
      document.getElementById("result").innerText = `Você ganhou: ${selected.name}`;
    }
  };
  animate();
}

canvas.addEventListener("click", spinWheel);

drawWheel();

  </script>
</body>
</html>
