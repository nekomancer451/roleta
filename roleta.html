<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Roleta de Prêmios</title>
  <style>
    :root {
      --primary-color: #1e88e5;
      --secondary-color: #90caf9;
      --background-color: #e3f2fd;
      --text-color: #0d47a1;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: bold;
      margin: 0;
      padding: 0;
      background-color: var(--background-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    h1 {
      margin: 10px 0;
      font-size: clamp(1.5rem, 6vw, 2.2rem);
      color: var(--primary-color);
      text-align: center;
      padding: 0 15px;
      margin-bottom: 30px;
    }

    #adminButton {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      font-size: clamp(0.8rem, 3.5vw, 1rem);
      z-index: 10;
    }

    #adminButton:hover {
      background-color: var(--text-color);
    }

    .wheel-container {
      position: relative;
      width: 95vw;
      max-width: 500px;
      aspect-ratio: 1/1;
      margin: 10px auto;
    }

    #wheel {
      width: 100%;
      height: 100%;
      display: block;
      border: 10px solid var(--primary-color);
      border-radius: 50%;
      background-color: white;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      position: relative
      margin-top: 40px; /* espaço para o ponteiro */
    }

    #pointer {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 60px solid red;   /* Aponta para baixo */
      border-radius: 0 0 20px 20px;
      border-bottom: none;
      position: absolute;
      top: -35px; /* ajuste para metade ficar para fora */
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.5));
      margin-top: 10px;
    }

    .result {
      margin-top: clamp(10px, 3vw, 20px);
      font-size: clamp(1.2rem, 5vw, 1.5rem);
      color: var(--text-color);
      padding: 30px;
      text-align: center;
      min-height: 60px;
      width: 95%;
    }

    /* Estilos para a seção administrativa */
    #adminPanel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      z-index: 1000;
      overflow: auto;
      padding: 20px;
    }

    #adminPanel h1 {
      text-align: center;
      margin-top: 30px;
      font-size: clamp(1.5rem, 6vw, 2rem);
    }

    #adminPanel form {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    #adminPanel input[type="text"], 
    #adminPanel input[type="number"] {
      padding: 10px;
      font-size: clamp(0.9rem, 4vw, 1rem);
      border: 1px solid #ccc;
      border-radius: 4px;
      flex: 1;
      min-width: 150px;
      max-width: 300px;
    }

    #adminPanel button {
      padding: 10px 15px;
      font-size: clamp(0.9rem, 4vw, 1rem);
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #adminPanel table {
      width: 100%;
      border-collapse: collapse;
    }

    #adminPanel th, 
    #adminPanel td {
      border: 1px solid #ccc;
      padding: 12px;
      text-align: center;
      font-size: clamp(0.8rem, 3.5vw, 1rem);
    }

    #adminPanel th {
      background-color: #eee;
    }

    #adminPanel .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2em;
      cursor: pointer;
      color: #555;
      background: none;
      border: none;
      font-weight: bold;
    }

    /* Botão de voltar para roleta */
    #backToWheel {
      margin: 20px auto;
      display: block;
      padding: 12px 20px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: clamp(0.9rem, 4vw, 1rem);
      font-weight: bold;
    }

    /* Responsividade para telas pequenas (celulares) */
    @media (max-width: 480px) {
      .wheel-container {
        width: 90vw;
      }
      
      #adminPanel form {
        flex-direction: column;
        align-items: center;
      }

      #adminPanel input[type="text"], 
      #adminPanel input[type="number"], 
      #adminPanel button {
        width: 100%;
        max-width: 100%;
        margin-right: 0;
        margin-bottom: 10px;
      }

      #adminPanel table, thead, tbody, th, td, tr {
        display: block;
      }

      #adminPanel thead tr {
        display: none;
      }

      #adminPanel tbody tr {
        margin-bottom: 15px;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 6px;
      }

      #adminPanel tbody td {
        border: none;
        text-align: right;
        padding-left: 50%;
        position: relative;
      }

      #adminPanel tbody td::before {
        content: attr(data-label);
        position: absolute;
        left: 10px;
        width: 45%;
        padding-left: 10px;
        font-weight: bold;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <button id="adminButton">Admin</button>

  <h1>Roleta de Prêmios</h1>
  <div class="wheel-container">
    <div id="pointer"><div class="pin-tail"></div></div>
    <canvas id="wheel"></canvas>
  </div>
  <div class="result" id="result"></div>

  <!-- Seção administrativa (oculta por padrão) -->
  <div id="adminPanel">
    <button class="close-btn" id="closeAdminPanel">&times;</button>
    <h1>Administração da Roleta</h1>
    
    <form id="addPrizeForm">
      <input type="text" id="prizeName" placeholder="Nome do prêmio" required>
      <input type="number" id="prizeQuantity" placeholder="Quantidade" min="1" required>
      <button type="submit">Adicionar Prêmio</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Quantidade</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="prizeTableBody"></tbody>
    </table>
    
    <button id="backToWheel" onclick="document.getElementById('adminPanel').style.display='none'">Voltar para a Roleta</button>
  </div>

  <script>
    // ============== Código da Roleta ==============
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const pointer = document.getElementById("pointer");
    let currentAngle = 0;
    let prizes = JSON.parse(localStorage.getItem("prizes")) || [];
    let isSpinning = false;

    // Função para redimensionar o canvas
    function resizeCanvas() {
      const container = document.querySelector('.wheel-container');
      const size = Math.min(container.clientWidth, container.clientHeight);
      canvas.width = size;
      canvas.height = size;
      drawWheel();
    }

    function drawWheel() {
      const numPrizes = prizes.length;
      if (numPrizes === 0) return;

      const arcSize = (2 * Math.PI) / numPrizes;
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = Math.min(centerX, centerY) - 10;

      const colors = [
        "#FF6F61", "#FFA07A", "#FFD700", "#90EE90", "#32CD99",
        "#40E0D0", "#87CEFA", "#9370DB", "#BA55D3", "#FF69B4"
      ];

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Desenha as fatias e textos
      for (let i = 0; i < numPrizes; i++) {
        const angle = i * arcSize;
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + arcSize);

        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "black";
        const fontSize = Math.max(14, Math.min(24, radius * 0.08));
        ctx.font = `bold ${fontSize}px Verdana`;
        ctx.fillText(prizes[i].name, radius - 20, 0);
        ctx.restore();
      }

      // Desenha as bolinhas por cima das sessões
      for (let i = 0; i < numPrizes; i++) {
        const angle = (i + 1) * arcSize;
        const dotRadius = radius - 2;
        const dotX = centerX + dotRadius * Math.cos(angle);
        const dotY = centerY + dotRadius * Math.sin(angle);
        ctx.beginPath();
        ctx.arc(dotX, dotY, 7, 0, 2 * Math.PI);
        ctx.fillStyle = "#fff";
        ctx.strokeStyle = "#888";
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();
      }
    }

    function spinWheel() {
      if (isSpinning) return; // Impede novo clique durante o giro
      isSpinning = true;

      const availablePrizes = prizes.filter(p => p.quantity > 0);
      if (availablePrizes.length === 0) {
        document.getElementById("result").innerText = "Todos os prêmios acabaram!";
        return;
      }

      // Sorteia o índice do prêmio
      const availableIndexes = prizes
        .map((p, idx) => p.quantity > 0 ? idx : -1)
        .filter(idx => idx !== -1);
      const selectedIdx = availableIndexes[Math.floor(Math.random() * availableIndexes.length)];
      const selected = prizes[selectedIdx];
      selected.quantity--;
      localStorage.setItem("prizes", JSON.stringify(prizes));

      const arcSize = (2 * Math.PI) / prizes.length;

      // Calcula o ângulo para alinhar o prêmio sorteado ao topo (ponteiro)
      // O topo é o ângulo 0 (em canvas, começa à direita, então subtrai Math.PI/2)
      const targetAngle = (3 * Math.PI / 2) - (selectedIdx * arcSize) - (arcSize / 2);
      // Adiciona voltas extras para animação
      const spinAngle = (10 * 2 * Math.PI) + targetAngle;
      currentAngle = spinAngle;

      const duration = 10000;
      const start = Date.now();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      const animate = () => {
        const now = Date.now();
        const elapsed = now - start;
        if (elapsed < duration) {
          const progress = elapsed / duration;
          const easeProgress = 1 - Math.pow(1 - progress, 7);
          const angle = currentAngle * easeProgress;

          // --- Shake do ponteiro ---
          const numPrizes = prizes.length;
          const arcSize = (2 * Math.PI) / numPrizes;
          // Ângulo atual da roleta (0 = topo)
          const normalizedAngle = (angle % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
          // Distância angular até a bolinha mais próxima
          let minDist = Math.PI * 2;
          for (let i = 0; i < numPrizes; i++) {
            const dotAngle = ((i + 1) * arcSize) % (2 * Math.PI);
            const dist = Math.abs(((normalizedAngle - dotAngle + Math.PI * 3) % (2 * Math.PI)) - Math.PI);
            if (dist < minDist) minDist = dist;
          }
          // Se estiver perto de uma bolinha, aplique um shake
          let shake = 0;
          if (minDist < 0.15) { // 0.15 radianos ~8.5 graus
            shake = Math.sin((minDist / 0.15) * Math.PI) * 18; // até 18 graus
          }
          pointer.style.transform = `translateX(-50%) rotate(${shake}deg)`;

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(angle);
          ctx.translate(-centerX, -centerY);
          drawWheel();
          ctx.restore();
          requestAnimationFrame(animate);
        } else {
          pointer.style.transform = "translateX(-50%) rotate(0deg)";
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(currentAngle);
          ctx.translate(-centerX, -centerY);
          drawWheel();
          ctx.restore();
          isSpinning = false;
          document.getElementById("result").innerText = `Você ganhou: ${selected.name}`;
        }
      };
      animate();
    }

    // Event Listeners
    canvas.addEventListener("click", spinWheel);
    window.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    // ============== Código Administrativo ==============
    const adminPanel = document.getElementById("adminPanel");
    const adminButton = document.getElementById("adminButton");
    const closeAdminPanel = document.getElementById("closeAdminPanel");
    const form = document.getElementById("addPrizeForm");
    const tableBody = document.getElementById("prizeTableBody");

    adminButton.addEventListener("click", () => {
      adminPanel.style.display = 'block';
      renderTable();
    });

    closeAdminPanel.addEventListener("click", () => {
      adminPanel.style.display = 'none';
    });

    function savePrizes() {
      localStorage.setItem("prizes", JSON.stringify(prizes));
      resizeCanvas(); // Redimensiona e redesenha a roleta
    }

    function renderTable() {
      tableBody.innerHTML = "";
      prizes.forEach((prize, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><input type="text" value="${prize.name}" onchange="updateName(${index}, this.value)"></td>
          <td><input type="number" min="0" value="${prize.quantity}" onchange="updateQuantity(${index}, this.value)"></td>
          <td><button onclick="removePrize(${index})">Remover</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    window.updateName = (index, newName) => {
      prizes[index].name = newName;
      savePrizes();
    };

    window.updateQuantity = (index, newQuantity) => {
      prizes[index].quantity = parseInt(newQuantity, 10);
      savePrizes();
    };

    window.removePrize = (index) => {
      prizes.splice(index, 1);
      savePrizes();
      renderTable();
    };

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("prizeName").value.trim();
      const quantity = parseInt(document.getElementById("prizeQuantity").value, 10);
      
      if (name && quantity > 0) {
        prizes.push({ name, quantity });
        savePrizes();
        renderTable();
        document.getElementById("prizeName").value = "";
        document.getElementById("prizeQuantity").value = "";
      }
    });

    // Inicialização
    resizeCanvas();
  </script>
</body>
</html>
